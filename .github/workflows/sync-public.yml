name: Sync Public Repository

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove Internal Files
        run: |
          rm -rf dev/
          rm -f AGENTS.md AGENTS_PHILOSOPHY.md
          rm -f .github/workflows/sync-public.yml

      - name: Push Sanitized Tree to Public Repo
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$PUBLIC_TOKEN" ]; then
            echo "::error::PUBLIC_REPO_TOKEN secret is not set or empty."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          
          # Stage and commit clean snapshot
          git add -A
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Automated sync from private source [skip ci]"
          fi

          # Push to public main branch
          git push "https://${PUBLIC_TOKEN}@github.com/JON99999/AMP.git" HEAD:main --force

          # Push tag if trigger was a tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            git tag -f "$TAG_NAME"
            git push "https://${PUBLIC_TOKEN}@github.com/JON99999/AMP.git" "$TAG_NAME" --force
          fi
