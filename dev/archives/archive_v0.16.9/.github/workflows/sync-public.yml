name: Sync Public Repository

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract Commit & Delta Info
        id: source_meta
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "commit_msg<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Remove Internal Files
        run: |
          rm -rf dev/
          rm -f AGENTS.md AGENTS_PHILOSOPHY.md
          rm -f .github/workflows/sync-public.yml

      - name: Push Sanitized Tree & Auto-Tag Release
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          COMMIT_MSG: ${{ steps.source_meta.outputs.commit_msg }}
        run: |
          if [ -z "$PUBLIC_TOKEN" ]; then
            echo "::error::PUBLIC_REPO_TOKEN secret is not set or empty."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          
          # Stage and commit clean snapshot with original delta commit message
          git add -A
          if ! git diff-index --quiet HEAD --; then
            git commit -m "$COMMIT_MSG"
          fi

          # Push to public main branch
          git push "https://${PUBLIC_TOKEN}@github.com/JON99999/AMP.git" HEAD:main --force

          # Determine target version tag from package.json
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_TAG="v${PKG_VERSION}"

          # Check if tag exists on public repository
          EXISTING_TAG=$(git ls-remote --tags "https://${PUBLIC_TOKEN}@github.com/JON99999/AMP.git" "refs/tags/${PKG_TAG}")

          if [ -z "$EXISTING_TAG" ]; then
            echo "New version detected (${PKG_TAG}). Creating and pushing release tag to public repository..."
            git tag -a "$PKG_TAG" -m "Release $PKG_TAG - $COMMIT_MSG" -f
            git push "https://${PUBLIC_TOKEN}@github.com/JON99999/AMP.git" "$PKG_TAG"
          else
            echo "Tag ${PKG_TAG} already exists on public repository."
          fi

          # If the private trigger itself was an explicit tag, sync that tag as well
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [ "$TAG_NAME" != "$PKG_TAG" ]; then
              TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME")
              if [ -n "$TAG_MSG" ]; then
                git tag -a "$TAG_NAME" -m "$TAG_MSG" -f
              else
                git tag -f "$TAG_NAME"
              fi
              git push "https://${PUBLIC_TOKEN}@github.com/JON99999/AMP.git" "$TAG_NAME" --force
            fi
          fi
