name: Build/Release Electron App

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v0.16.8
  release:
    types: [published, created]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Release Tag
        id: release_meta
        run: |
          node -e "const ref = process.env.GITHUB_REF || ''; const relTag = process.env.RELEASE_TAG || ''; let tag = ''; if (ref.startsWith('refs/tags/')) { tag = ref.replace('refs/tags/', ''); } else if (relTag) { tag = relTag; } else { tag = 'v' + require('./package.json').version; } const fs = require('fs'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\n'); console.log('Resolved Release Tag:', tag);"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Build Electron App
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
